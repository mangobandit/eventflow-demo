name: Deploy site to GitHub Pages

# The wedding site is a static site served from the repository root. GitHub
# Pages must be enabled for this repository with GitHub Actions selected as the
# publishing source. This workflow then publishes the complete site, including
# the CNAME file that binds mxcwedding.com.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assemble published site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='node_modules' \
            ./ _site/
          test -f _site/index.html
          test "$(tr -d '\r\n' < _site/CNAME)" = "mxcwedding.com"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # The repository is public, so the workflow token can create the Pages
          # site itself. This is a no-op once Pages is enabled.
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
